name: Compatibility report
description: Tell us how the tool behaved on a VCF Operations version. This is how the matrix grows.
title: "Compatibility: VCF Operations <version> with <tool version>"
labels: ["compatibility"]
body:
  - type: input
    id: ops-version
    attributes:
      label: VCF Operations version
      placeholder: 9.1.1
    validations:
      required: true
  - type: input
    id: vcf-version
    attributes:
      label: VCF version (if part of a VCF deployment)
      placeholder: "9.1"
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works, everything I tried
        - Works with caveats (describe below)
        - Does not work
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What you tried and what you saw
      description: Commands, deployment size, anything unusual. Redact host names and IPs.
