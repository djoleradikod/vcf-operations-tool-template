name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"

      - name: Naming, licence, compatibility, permissions, generated docs
        run: python scripts/repokit.py check

      - name: Privacy scan
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: python scripts/repokit.py privacy

      - name: Lint and format (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Lint workflows (actionlint) and shell scripts (shellcheck)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
          shellcheck scripts/*.sh

      - name: Lint PowerShell (PSScriptAnalyzer)
        if: hashFiles('**/*.ps1', '**/*.psm1') != ''
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -EnableExit

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Build package and release assets (dry run)
        run: |
          python -m build --outdir dist
          python -m twine check --strict dist/*
          python scripts/repokit.py bundle --outdir dist
          python scripts/repokit.py project-json -o dist/project.json
          ls -l dist

  ci-ok:
    # The one check to require in branch rules, so the test matrix can change freely.
    name: CI OK
    if: always()
    needs: [rules, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
