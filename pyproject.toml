[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "template-tool-for-vcf-operations"
dynamic = ["version"]
description = "One sentence that says what the tool does and who it is for."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Jay Djonko" }]
keywords = ["vcf-operations", "vmware-cloud-foundation", "vcf", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = ["requests>=2.31", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "ruff>=0.6",
    "shellcheck-py>=0.10",
    "twine>=5.1",
]

[project.scripts]
template-tool = "template_tool.cli:main"

[project.urls]
Homepage = "https://djonko.dev/projects/template-tool"
Source = "https://github.com/djoleradikod/template-tool-for-vcf-operations"
Issues = "https://github.com/djoleradikod/template-tool-for-vcf-operations/issues"
Changelog = "https://github.com/djoleradikod/template-tool-for-vcf-operations/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "template_tool.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/*/_meta.py"] # generated by repokit render

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "E501"] # the formatter owns line length; long literals are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S104", "S603", "S607"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["template_tool"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
